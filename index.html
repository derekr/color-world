<style>
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/baloo-2-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:700;font-display:swap;src:url(fonts/baloo-2-latin-700-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Baloo 2';font-style:normal;font-weight:800;font-display:swap;src:url(fonts/baloo-2-latin-800-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--ink:#1E1B18;--paper:#FFFBF2;--accent:#FFC93C;--accent-soft:#FFC93C66;--coral:#FF8A65;--muted:#5B534B;--track:#EDE5D6}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:'Baloo 2','Trebuchet MS',system-ui,sans-serif}
button{font:inherit;color:inherit}
button,[role=button],.toggle,.btn,.rb,.tile,.pill,.dotb,.seg button{touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
color-map{position:absolute;inset:0;display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:8px 20px;min-height:64px;background:#fff;border-bottom:2px solid var(--ink)}
.brand{display:flex;align-items:center;gap:10px;font-size:24px;font-weight:800;letter-spacing:-.01em}
.search{position:relative;flex:0 1 360px;min-width:200px;margin:0}
.search svg{position:absolute;left:16px;top:14px}
.grow{flex:1}
.work{display:flex;flex-wrap:wrap;flex:1;min-height:0}
aside{flex:1 1 300px;max-width:360px;display:flex;flex-direction:column;gap:16px;padding:20px;border-right:2px solid var(--ink);background:var(--paper)}
main{flex:999 1 560px;min-width:0;position:relative;overflow:hidden;height:calc(100vh - 68px);background:#fff}
#map{position:absolute;inset:0;background:#fff;font-family:inherit}
#map.tool-text{cursor:crosshair}
#map .leaflet-interactive{cursor:inherit}
#map.tool-move .leaflet-interactive{cursor:pointer}
#map.leaflet-drag-target,#map.leaflet-grab{cursor:grab}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:48px;padding:4px 4px 4px 2px;background:none;border:0;cursor:pointer;font-size:18px;font-weight:700;text-align:left}
.sw{position:relative;flex:none;width:54px;height:32px;border-radius:999px;border:2px solid var(--ink);background:var(--track);transition:background .15s}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;border:2px solid var(--ink);transition:left .15s}
.toggle[aria-pressed="true"] .sw{background:var(--accent)}
.toggle[aria-pressed="true"] .sw i{left:25px}

.seg button:active,.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.seg{display:flex;gap:6px;padding:5px;border:2px solid var(--ink);border-radius:18px;background:#fff}
.seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;min-height:44px;min-width:48px;padding:0 12px;border:0;border-radius:12px;background:none;font-size:16px;font-weight:700;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);box-shadow:inset 0 0 0 2px var(--ink)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 18px;border:2px solid var(--ink);border-radius:16px;background:#fff;box-shadow:0 3px 0 var(--ink);font-size:18px;font-weight:800;cursor:pointer}
.icon-btn{width:48px;padding:0}
.btn[aria-pressed="true"]{background:var(--accent)}
.slide{display:flex;align-items:center;gap:10px;padding:0 2px 10px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:0;height:32px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:99px;background:var(--track);border:2px solid var(--ink)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--accent);border:2px solid var(--ink);margin-top:-11px}
input[type=range]::-moz-range-track{height:6px;border-radius:99px;background:var(--track);border:2px solid var(--ink)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--accent);border:2px solid var(--ink)}
.field{width:100%;height:46px;padding:0 14px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);font:inherit;font-size:18px;font-weight:600;color:var(--ink)}
.field:focus,.btn:focus-visible,.tile:focus-visible,.pill:focus-visible,.dotb:focus-visible,.seg button:focus-visible,.toggle:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.search .field{height:48px;padding-left:46px;border-radius:999px}
.card{display:flex;flex-direction:column;gap:6px;padding:16px;border:2px solid var(--ink);border-radius:22px;background:#fff}
.card h2{margin:0 0 4px;font-size:15px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.cards{display:flex;flex-direction:column;gap:16px}

/* features panel: game-card tiles, swipeable pages, push/pop sub-views */
.tile{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:1;min-width:0;padding:6px 4px 8px;border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--ink);cursor:pointer;font-weight:700;text-align:center;line-height:1}
.tile:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.tile[aria-pressed="true"]{background:var(--accent)}
.tile .ic{width:var(--ic,40px);height:var(--ic,40px);flex:none}
.tile .tn{display:flex;align-items:flex-start;justify-content:center;height:var(--tnh,28px);font-size:var(--tnf,13px);line-height:1.05}
.tile .ck{position:absolute;top:5px;right:5px;width:22px;height:22px}
.tile .cnt{position:absolute;top:5px;right:5px;display:flex;align-items:center;gap:0;height:22px;padding:0 3px 0 7px;border-radius:99px;background:var(--ink);color:#fff;font-size:12px;font-weight:800;line-height:1}
.tile .cnt svg{width:12px;height:12px}
.fv{display:grid;overflow:hidden}
.fv-pane{grid-area:1/1;min-width:0;transition:transform .3s cubic-bezier(.3,.8,.3,1),visibility 0s linear .3s}
.fv-root{visibility:visible;transform:none}
.fv-sub{visibility:hidden;transform:translateX(100%)}
.fv.sub .fv-root{visibility:hidden;transform:translateX(-100%)}
.fv:not(.sub) .fv-root,.fv-sub.on{transition:transform .3s cubic-bezier(.3,.8,.3,1),visibility 0s}
.fv-sub.on{visibility:visible;transform:none}
.fp-nav{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.pills{display:flex;gap:6px}
.pill{height:34px;padding:2px 14px 0;border:2px solid var(--ink);border-radius:999px;background:#fff;font-size:16px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill[aria-pressed="true"]{background:var(--ink);color:#fff}
.fp-arrows{display:none;align-items:center;justify-content:space-between;gap:8px;margin-bottom:14px;font-size:22px;font-weight:800}
.arw{width:40px;height:40px;padding:0;border-radius:12px}
.arw[disabled]{opacity:.3;cursor:default}
.pager{overflow:hidden;padding-bottom:6px;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.track{display:flex;gap:12px;transform:translateX(calc(var(--p,0) * (-100% - 12px)));transition:transform .3s cubic-bezier(.3,.8,.3,1)}
.page{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;flex:0 0 100%;min-width:0;align-content:start}
.dots{display:flex;justify-content:center;margin-top:-2px}
.dotb{padding:9px 5px;border:0;background:none;cursor:pointer}
.dotb i{display:block;width:10px;height:10px;border-radius:99px;border:2px solid var(--ink);background:#fff;transition:width .2s}
.dotb[aria-pressed="true"] i{width:28px;background:var(--accent)}
.sub-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:22px;font-weight:800}
.fv-sub .page{padding-bottom:6px}
@media (prefers-reduced-motion:reduce){.fv-pane,.track,.dotb i,.tile{transition:none!important}}
@media (min-width:1100px){
  aside{flex-basis:340px;max-width:380px;max-height:calc(100vh - 68px);overflow:auto}
  .tile{--ic:34px;--tnh:26px;--tnf:12.5px}
  .fp-nav{display:none}
  .fp-arrows{display:flex}
}

/* map overlays */
.tools{position:absolute;left:20px;top:20px;z-index:1000;display:flex;gap:8px;padding:6px;border:2px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 3px 0 var(--ink)}
.tools .btn{box-shadow:none;border-radius:14px}
.pageseg{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);z-index:1000;box-shadow:0 3px 0 var(--ink)}
.zoom{position:absolute;right:20px;bottom:20px;z-index:1000;display:flex;flex-direction:column;gap:8px}
.frame{position:absolute;z-index:500;border:2.5px dashed var(--ink);border-radius:6px;box-shadow:0 0 0 4000px rgba(244,238,226,.8);pointer-events:none;transition:left .3s,top .3s,width .3s,height .3s}
.frame .tag{position:absolute;top:-36px;right:-3px;padding:5px 12px 3px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:700;white-space:nowrap}
.pop{position:absolute;z-index:1100;width:250px;padding:14px;border:2px solid var(--ink);border-radius:20px;background:#fff;box-shadow:0 5px 0 var(--ink);display:flex;flex-direction:column;gap:10px}
.pop-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pop-head span{font-size:24px;font-weight:800}
.pop label{font-size:15px;font-weight:700;color:var(--muted)}


/* ---------- responsive: shared bits (hidden on desktop) ---------- */
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grab,.close-x,.pop .done,#dock{display:none}
.rb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0;border:2px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 3px 0 var(--ink);font-size:15px;font-weight:800;line-height:1.1;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rb[aria-pressed="true"]{background:var(--accent)}
.rb:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.rb-print{background:var(--coral)}
.rb:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.grab{width:44px;height:5px;border-radius:99px;background:#CFC6B8;margin:0 auto 6px}
.close-x{height:40px;width:40px;border-radius:12px;box-shadow:none}

@media (max-width:1099px){
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{position:fixed;inset:0;width:100%;-webkit-text-size-adjust:100%}
  .app{position:relative;height:100vh;height:100dvh;min-height:0;overflow:hidden}
  header{flex-wrap:nowrap}
  .work{position:relative;display:block;flex:1;min-height:0}
  main{position:absolute;inset:0;height:auto;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  .ft-t{-webkit-user-select:text;user-select:text}
  #map{-webkit-tap-highlight-color:transparent}
  .tools{display:none}
  #dock{display:flex}
  .close-x{display:flex}
  .card:not(.open){display:none}
  aside{position:absolute;z-index:1250;padding:0;border:0;background:none;max-width:none;pointer-events:none}
  .cards{display:block}
  .card.open{pointer-events:auto;overflow:auto;-webkit-overflow-scrolling:touch}
  .ft .ft-grip,.ft .ft-x{width:34px;height:36px}
}
/* tablet */
@media (min-width:700px) and (max-width:1099px) and (min-height:500px){
  #dock{position:absolute;left:16px;top:16px;z-index:1000;flex-direction:column;gap:8px;padding:8px;border:2px solid var(--ink);border-radius:24px;background:#fff;box-shadow:0 3px 0 var(--ink);max-height:calc(100% - 32px);overflow:auto}
  .rb{width:68px;min-height:68px;border:0;border-radius:16px;background:none;box-shadow:none;font-size:14px}
  .rb:active{transform:none}
  .rb[aria-pressed="true"]{background:var(--accent);box-shadow:inset 0 0 0 2px var(--ink)}
  .rb-print{display:none}
  .rb-move{order:1}.rb-words{order:2}.rb-lines{order:3}.rb-features{order:4}
  aside{left:116px;top:16px;width:340px;max-width:calc(100% - 132px);max-height:calc(100% - 32px)}
  .card.open{max-height:calc(100dvh - 68px - 32px);box-shadow:0 5px 0 var(--ink)}
}
/* phone (also short landscape screens: phone held sideways) */
@media (max-width:699px), (max-width:1099px) and (max-height:499px){
  header{position:absolute;z-index:1300;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top));padding:0;min-height:0;gap:8px;background:none;border:0;pointer-events:none}
  header>*{pointer-events:auto}
  .grow,#printBtn,.brand span,.zoom{display:none}
  .brand{flex:none}
  .brand svg{display:block;width:48px;height:48px;filter:drop-shadow(0 3px 0 var(--ink))}
  .search{flex:1 1 auto;min-width:0}
  .search svg{left:15px;top:14px}
  .search .field{box-shadow:0 3px 0 var(--ink);font-size:17px}
  .work{position:absolute;inset:0}
  #dock{position:absolute;left:0;right:0;bottom:0;z-index:1000;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding:12px 12px calc(14px + env(safe-area-inset-bottom));background:#fff;border-top:2px solid var(--ink);border-radius:24px 24px 0 0}
  .rb{min-height:64px}
  .rb-move{display:none}
  .rb-lines{order:1}.rb-features{order:2}.rb-words{order:3}.rb-print{order:4}
  .pageseg{bottom:calc(106px + env(safe-area-inset-bottom));padding:4px;gap:4px;border-radius:16px}
  .pageseg button{min-width:48px;padding:0 10px;font-size:15px}
  .has-sheet #dock,.has-sheet .pageseg{display:none}
  aside{left:0;right:0;bottom:0}
  .card.open,.pop{border:0;border-top:2px solid var(--ink);border-radius:28px 28px 0 0;box-shadow:none;padding:10px 20px calc(24px + env(safe-area-inset-bottom))}
  .card.open{max-height:75vh;max-height:75dvh;gap:4px}
  .grab{display:block}
  .card h2,.pop-head span{font-size:26px;font-weight:800;letter-spacing:0;text-transform:none;color:var(--ink);margin:0}
  .pop{left:0!important;right:0;top:auto!important;bottom:0;width:auto;z-index:1250}
  .pop .done{display:flex;background:var(--accent);width:100%}
  .frame .tag{font-size:13px;top:-32px}
  .fv{margin:0 -20px}
  .fv-pane{padding:0 20px}
  .pager{margin:0 -20px;padding-left:20px}
  .page{flex-basis:calc(100% - 50px)}
  .track{gap:12px;transform:translateX(calc(var(--p,0) * (38px - 100%)))}
  .tile{--ic:46px;--tnh:30px;--tnf:14px}
}

/* phone held sideways: compact bar/dock, page segment moves up beside the search */
@media (max-width:1099px) and (max-height:499px){
  header{left:calc(12px + env(safe-area-inset-left));right:calc(12px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top))}
  .brand svg{width:44px;height:44px}
  .search{flex:0 1 380px}
  .search .field{height:44px}
  .search svg{top:12px}
  .pageseg{bottom:auto;left:auto;transform:none;top:calc(8px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));z-index:1300;padding:3px;gap:3px;border-radius:14px}
  .pageseg button{min-height:38px;min-width:44px;padding:0 8px;font-size:14px}
  #dock{gap:8px;padding:6px calc(12px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));border-radius:18px 18px 0 0}
  .frame .tag{top:6px;right:6px;font-size:12px;padding:3px 9px 2px}
  .rb{min-height:46px;flex-direction:row;gap:8px}
  .page{grid-template-columns:repeat(4,minmax(0,1fr))}
  .tile{aspect-ratio:auto;height:84px;--ic:34px;--tnh:16px}
  .card.open{max-height:min(85vh,calc(100vh - 64px));max-height:min(85dvh,calc(100dvh - 64px));padding:8px 20px calc(14px + env(safe-area-inset-bottom))}
  .pop{max-height:min(85dvh,calc(100dvh - 64px));overflow:auto}
}

/* labels (Leaflet divIcons) */
.cn{font-weight:800;font-size:22px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 3px #fff}
.hollow .cn{color:#fff;-webkit-text-stroke:1.4px var(--ink);paint-order:stroke fill;text-shadow:none}
.on-lbl{font-weight:600;font-style:italic;font-size:15px;letter-spacing:.12em;color:var(--ink);text-shadow:0 0 4px #fff,0 0 4px #fff,0 0 3px #fff}
.hollow .on-lbl{color:#fff;-webkit-text-stroke:1px var(--ink);paint-order:stroke fill;text-shadow:none;font-weight:700}
.lbl-wrap{width:0!important;height:0!important;margin:0!important;background:none;border:0;pointer-events:none}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;line-height:1;pointer-events:none}
.nm{font-weight:700;font-size:12px;letter-spacing:.02em;color:var(--ink);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 2px #fff}
.hollow .nm{color:#fff;-webkit-text-stroke:1.1px var(--ink);paint-order:stroke fill;font-weight:800;font-size:14px;letter-spacing:.04em;text-shadow:none}
.tb{display:flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 5px;border:1.5px solid var(--ink);border-radius:999px;background:#fff;font-size:12px;font-weight:800}
.mine{font-size:13px;font-weight:700;background:#fff;border:1.5px dashed var(--ink);border-radius:8px;padding:2px 7px 1px}
.cap{position:absolute;left:0;top:0;width:15px;height:15px;transform:translate(-50%,-50%);pointer-events:none}
.ft-wrap{width:0!important;height:0!important;margin:0!important;background:none;border:0}
.ft{position:absolute;left:0;top:0;transform:translate(-50%,-50%);display:flex;align-items:center;gap:2px;padding:2px 4px 0 2px;border:2px dashed var(--ink);border-radius:12px;background:#fff;font-size:20px;font-weight:800;white-space:nowrap;line-height:1.2;color:var(--ink)}
.ft-t{min-width:2ch;padding:2px 6px 0;outline:0;cursor:text}
.ft:focus-within{box-shadow:0 0 0 3px var(--accent)}
.ft-grip,.ft-x{flex:none;width:24px;height:28px;display:flex;align-items:center;justify-content:center;padding:0;border:0;background:none;cursor:pointer}
.ft-grip{cursor:move;touch-action:none}
.ft-x{border-radius:50%}
.ft-x:hover{background:var(--accent-soft)}

/* print (mirrored by body.printing so it can be previewed) */
html:has(body.printing),body.printing{background:#fff}
body.printing header,body.printing aside,body.printing #dock,body.printing .tools,body.printing .pageseg,body.printing .zoom,body.printing .frame,body.printing .pop,body.printing .ft-grip,body.printing .ft-x{display:none!important}
html:has(body.printing),body.printing{position:static;height:auto;overflow:visible;width:auto}
body.printing .app{display:block;min-height:0;height:auto;overflow:visible;position:static}
body.printing .work{display:block;position:static}
body.printing main{position:absolute;left:0;top:0;right:auto;bottom:auto;width:auto;height:auto;overflow:visible;background:#fff;border:0}
body.printing #map{position:relative;inset:auto;width:var(--pw);height:var(--ph);cursor:default}
body.printing .ft{box-shadow:none!important;border:0!important;background:transparent!important;padding:0}
body.printing *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{
  html,body{background:#fff}
}
</style>
